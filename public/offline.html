<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>Offline · Traveler Handal</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #222222;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      main { max-width: 360px; text-align: center; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #3f3f3f; line-height: 1.5; margin: 0 0 20px; }
      a {
        display: inline-block;
        background: #2563eb;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        padding: 12px 20px;
        border-radius: 8px;
      }
      a:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Kamu sedang offline</h1>
      <p>Halaman ini belum pernah dibuka di perangkat ini. Trip yang terakhir kamu buka tetap bisa dilihat dari daftar trip.</p>
      <a href="/trips">Buka daftar trip</a>
    </main>
  </body>
</html>
